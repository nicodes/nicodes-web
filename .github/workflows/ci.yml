name: CI

# Every pull request and every merge to main: build, then test, on one runner.
#
# Nothing is published and nothing is deployed. Vercel deploys this site from
# its own build, configured in Vercel rather than here, so a green tick means
# one thing -- this commit is good.
#
# The push trigger is NOT redundant the way it would be in a -be repo. There,
# cd.yml re-runs Build and Test after a merge, so ci.yml can be pull_request
# only. Here there is no cd.yml, and Vercel's build does not run
# .github/actions/test -- it runs `bun run build` and ships the result. This
# workflow is the only thing that ever runs the assertions.
#
# One job, because a job is a machine: two would each pay their own checkout and
# their own `bun install` to split one green tick in two. Build and Test are
# separate STEPS, so the log still shows which is which and a failure still says
# so.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. This workflow only inspects the tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # This build is seconds. Ten minutes means something has hung, and it should
    # say so here rather than sit until the runner's own timeout hours later.
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned by SHA, with the tag in a trailing
      # comment so the version is still readable. A tag is a moving reference:
      # whoever can move it can run code in this job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Reads .mise.toml, which is where bun's version is already pinned for
      # everyone working on this repo. This used to be oven-sh/setup-bun with
      # `bun-version: "1.3"` written out here -- a second place to change one
      # version, and two places drift.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Build
        uses: ./.github/actions/build

      - name: Test
        uses: ./.github/actions/test

      - name: Check out integration verification tools
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/tools
          ref: 6a651cc9c59c0cec127f987bcbac0074352e88b5
          path: .artifacts/dependency-tools
          persist-credentials: false
      - name: Record tested integration identity
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: /usr/bin/python3 -I -B .artifacts/dependency-tools/helpers/integration-identity.py
      - name: Upload integration identity
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/fleet-integration.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
